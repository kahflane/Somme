[package]
name = "somme-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sees and uses this computer's screen, mouse and keys, for Somme's agents"

[dependencies]
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Tells password boxes apart.
accessibility = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSKeyValueCoding", "NSString"] }
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
device_query = "4"
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[lints]
workspace = true
