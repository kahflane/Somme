[package]
name = "somme-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Somme's Automations: the flow format, its checks, and the engine that runs a flow's steps"

[dependencies]
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# Paths in a scope, like ~/Projects/**/node_modules.
globset = "0.4"
hickory-resolver = "0.25"
parking_lot = "0.12"
regex = "1"
reqwest.workspace = true
somme-ai.workspace = true
somme-patch.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "macros", "net"] }
tokio-util.workspace = true
tracing.workspace = true
# Reads shell code: the same parser and grammar the editor uses.
tree-sitter = "0.26"
tree-sitter-bash = "0.23"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
