[package]
name = "somme-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Somme SSH client, native GPUI app"

[[bin]]
name = "somme-desktop"
path = "src/main.rs"

[dependencies]
somme-domain.workspace = true
somme-application.workspace = true
somme-infrastructure.workspace = true
somme-ai.workspace = true
somme-automation.workspace = true
somme-patch.workspace = true
somme-computer.workspace = true
alacritty_terminal = "0.26"
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap.workspace = true
dirs.workspace = true
notify = "8.2"
# Checks that an update was signed by Somme's release key.
ed25519-dalek = "3.0"
fontdb.workspace = true
# Only one Somme opens the database: the app, or the background service.
fs4 = "0.13"
futures = "0.3"
# ripgrep's folder walker, for searching files.
ignore = "0.4"
# jq, for pulling data out of JSON and JSON Lines files.
jaq-all = { version = "0.3", default-features = false, features = ["std-all"] }
# Syntax colours for the file editor. SQL is left out: its grammar needs an older `cc`
# than Turso's build allows.
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter-astro", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-ejs", "tree-sitter-elixir", "tree-sitter-erb", "tree-sitter-go", "tree-sitter-graphql", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-jsdoc", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig"
] }
lsp-types = { version = "0.97", features = ["proposed"] }
# Splits Markdown into blocks for the preview. The same parser the text view uses.
markdown = "1"
memchr = "2"
# Mermaid diagrams in the Markdown preview, drawn to SVG.
mermaid-rs-renderer = { version = "0.3", default-features = false }
parking_lot = "0.12"
percent-encoding = "2"
# Makes the key that signs updates. Release tooling only.
rand.workspace = true
regex = "1"
# GitHub's API, for pull requests and issues.
reqwest.workspace = true
# The same version the editor kit uses, so its `Rope` is this one.
# Reads web SVG images, to show animated ones as they end up.
roxmltree = "0.21"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf"] }
serde.workspace = true
serde_json.workspace = true
# Hashes update downloads and voice models, to check them.
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
trash = "5"
uuid.workspace = true
# Speech to text for the voice button: whisper.cpp, and the microphone.
whisper-rs = "0.16"
cpal = "0.18"
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[build-dependencies]
# The icon, name and version inside Somme.exe.
winresource = "0.1"

[features]
snapshot = ["gpui-kit/test-support"]

[lints]
workspace = true
