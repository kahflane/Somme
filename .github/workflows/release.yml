# Builds Somme for macOS, Windows and Linux. The Apple chip and Intel Mac
# builds are joined into one app that runs on both.
#
# Push a tag like v0.2.0 (matching `version` in Cargo.toml) to publish a
# GitHub release with every build, SHA256SUMS and, when the signing key is
# set, SHA256SUMS.sig. Somme's updater reads that release.
#
# Run it by hand (Actions > Release > Run workflow) to only build and check:
# the files are kept as the run's artifacts, and nothing is published.
#
# Signing: put the private key file's text in the repository secret
# SOMME_UPDATE_SIGNING_KEY, and its public key in
# crates/somme-desktop/assets/update-key.pub. Without the secret, the release
# has no signature and Somme only offers to open its page.
#
# Mac signing: with these secrets the Mac app is signed with a Developer ID
# certificate and notarized by Apple, so it opens with no warning. Without
# them it gets a quick signature, and macOS warns on first open.
#   MACOS_CERTIFICATE           the Developer ID Application .p12, in base64
#   MACOS_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_NOTARY_KEY            an App Store Connect API key's .p8 text
#   APPLE_NOTARY_KEY_ID         that key's ID
#   APPLE_NOTARY_ISSUER         the Issuer ID shown above the keys

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libssl-dev libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev libzstd-dev

      - name: Read the version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} doesn't match version $version in Cargo.toml."
            exit 1
          fi

      - name: Build for macOS
        if: runner.os == 'macOS'
        run: |
          arch=$(rustc -vV | sed -n 's/^host: //p' | cut -d- -f1)
          app=$(crates/somme-desktop/macos-app.sh --release | tail -n 1)
          mkdir -p dist
          # The universal job below joins this with the other chip's.
          ditto -c -k --keepParent "$app" "dist/Somme-$VERSION-macos-$arch.zip"

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p somme-desktop
          root="Somme-$VERSION-linux-x86_64"
          mkdir -p "dist/$root"
          cp target/release/somme-desktop "dist/$root/somme"
          cp crates/somme-desktop/assets/icon.svg "dist/$root/somme.svg"
          cat > "dist/$root/somme.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Somme
          Comment=SSH client and terminal
          Exec=somme %U
          Icon=somme
          Terminal=false
          Categories=Development;System;TerminalEmulator;
          EOF
          tar -C dist -czf "dist/$root.tar.gz" "$root"
          rm -rf "dist/$root"

      - name: Build for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p somme-desktop
          mkdir -p dist
          cp target/release/somme-desktop.exe dist/Somme.exe
          (cd dist && 7z a "Somme-$VERSION-windows-x86_64.zip" Somme.exe >/dev/null && rm Somme.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  universal:
    name: Build macos-universal
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: parts

      - name: Join the Apple chip and Intel apps
        run: |
          arm=$(ls parts/macos-aarch64/Somme-*-macos-aarch64.zip)
          version=$(basename "$arm" | sed 's/^Somme-\(.*\)-macos-aarch64\.zip$/\1/')
          ditto -x -k "$arm" arm
          ditto -x -k parts/macos-x86_64/Somme-"$version"-macos-x86_64.zip intel
          exe=Contents/MacOS/Somme
          lipo -create "arm/Somme.app/$exe" "intel/Somme.app/$exe" -output universal
          mv universal "arm/Somme.app/$exe"
          lipo "arm/Somme.app/$exe" -verify_arch arm64 x86_64
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: crates/somme-desktop/macos.entitlements
          sparse-checkout-cone-mode: false

      # Joining breaks the old signature, so the app is signed again here.
      - name: Sign and notarize the Mac app
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          app=arm/Somme.app
          if [ -z "$CERTIFICATE" ] || [ -z "$NOTARY_KEY" ]; then
            echo "::warning::MACOS_CERTIFICATE or APPLE_NOTARY_KEY isn't set, so the Mac app has a quick signature and macOS warns when it's first opened."
            codesign --force --sign - "$app"
            codesign --verify "$app"
            exit 0
          fi
          # A keychain of its own, holding only the Developer ID certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Apple's middle certificates, so the signature reaches Apple's root.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" >/dev/null || true
          done
          read -ra others <<< "$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application certificate."
            exit 1
          fi
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --entitlements source/crates/somme-desktop/macos.entitlements --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 "$app"

          # Apple checks the app, then macOS opens it with no warning.
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --output-format json)
          echo "$result"
          if [ "$(echo "$result" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$result" | jq -r .id)" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            rm -f "$key"
            echo "::error::Apple didn't accept the app."
            exit 1
          fi
          rm -f "$key"
          # Staple the result to the app, so it opens offline too.
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Zip the Mac app
        run: |
          mkdir -p dist
          # The updater unpacks this with `ditto -x -k` and wants Somme.app at the top.
          ditto -c -k --keepParent arm/Somme.app "dist/Somme-$VERSION-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, universal]
    if: github.ref_type == 'tag'
    # macOS, so the signing tool in the Mac build runs as it is.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the checksums
        working-directory: dist
        run: |
          # Only the joined Mac app is published.
          rm -f Somme-*-macos-aarch64.zip Somme-*-macos-x86_64.zip
          shasum -a 256 Somme-* > SHA256SUMS && cat SHA256SUMS

      - name: Sign the checksums
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.SOMME_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::SOMME_UPDATE_SIGNING_KEY isn't set, so the release isn't signed and Somme won't install it by itself."
            exit 0
          fi
          tool=$(mktemp -d)
          ditto -x -k Somme-*-macos-universal.zip "$tool"
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 600 "$key"
          "$tool/Somme.app/Contents/MacOS/Somme" --update-sign "$key" SHA256SUMS
          rm -f "$key"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Somme ${GITHUB_REF_NAME#v}" \
            --generate-notes
