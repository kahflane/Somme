[workspace]
resolver = "3"
members = [
    "crates/somme-domain",
    "crates/somme-application",
    "crates/somme-infrastructure",
    "crates/somme-cloud",
    "crates/somme-desktop",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
somme-domain = { path = "crates/somme-domain" }
somme-application = { path = "crates/somme-application" }
somme-infrastructure = { path = "crates/somme-infrastructure" }

anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
sha2 = "0.11"
tower-http = { version = "0.7", features = ["trace", "limit", "timeout"] }
tower_governor = "0.8"
arc-swap = "1.9"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
dashmap = "6.2"
dirs = "6"
fast-socks5 = "1.0"
fontdb = "0.24"
keyring = "4.2"
portable-pty = "0.9"
rand = "0.10"
russh = "0.64"
russh-sftp = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2-config = "0.8"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.8", features = ["sync"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Libraries run optimized even in debug builds. Unoptimized layout and drawing
# made scrolling busy pages lag. Our own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
